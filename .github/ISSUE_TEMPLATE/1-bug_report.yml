name: Bug report
description: Something of the plugin does not work as expected (API, key page, Swagger UI, installation).
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

        > [!CAUTION]
        > **Never post your API key** (`xtk_...`), not even in a curl command or a log. Replace it with `xtk_REDACTED`.
        > If you posted a key by accident, regenerate it on `/api-schluessel` immediately.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where does the problem happen?
      options:
        - API endpoint (/api/v1/...)
        - Authentication / API key (401, 429, ...)
        - Key page (/api-schluessel)
        - Swagger UI / OpenAPI description (/api/docs)
        - Installation / activation / migration
        - Removing the plugin
        - Other
    validations:
      required: true

  - type: input
    id: endpoint
    attributes:
      label: Endpoint
      description: Method and path, if the problem is in the API.
      placeholder: "PUT /api/v1/games/123/tip"

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Including the request (headers, body) if relevant. Remove your key!
      placeholder: |
        1. Create a key on /api-schluessel
        2. curl -X PUT -H "Authorization: Bearer xtk_REDACTED" -H "Content-Type: application/json" -d '{"home_goals": 2, "guest_goals": 1}' https://your-site/api/v1/games/123/tip
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect? If the website behaves differently than the API, describe what the website does.
    validations:
      required: true

  - type: input
    id: status
    attributes:
      label: HTTP status code
      placeholder: "500"

  - type: textarea
    id: response
    attributes:
      label: Response / error message
      description: The JSON answer of the API or the error shown in the browser.
      render: json

  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: Relevant lines of `storage/logs/laravel.log` (remove personal data and keys).
      render: shell

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: See `version` in `plugin.json`.
      placeholder: "0.0.1"
    validations:
      required: true

  - type: input
    id: xtipp-version
    attributes:
      label: xTIPP version
      placeholder: "1.0.35"
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.4"

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Relevant settings (for example available leagues, hidden pages, tip overview settings), other plugins, client used (curl, app, script, ...).

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed every API key and personal data from this report.
          required: true
        - label: I checked that all files of the plugin were uploaded and the plugin is activated.
          required: true
        - label: I searched the existing issues and this bug was not reported yet.
          required: true
